<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBA 編輯器已搬家</title>
<meta name="robots" content="noindex">
<script>
  // 轉到新版編輯器的 JBP 頁（#sba），保留網址後面的 ?參數
  location.replace('https://jimmywu-commits.github.io/MS/shopee2/index.html' + location.search + '#sba');

<noscript><meta http-equiv="refresh" content="0; url=https://jimmywu-commits.github.io/MS/shopee2/index.html#sba"></noscript>
<style>
  :root { --bg: #f5f6f8; --surface: #fff; --text: #1c2430; --text-2: #545e6c; --accent: #ee4d2d; --on-accent: #fff; --border: #e3e6eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --surface: #171b21; --text: #e8ebf0; --text-2: #aab2be; --accent: #ff7a5c; --on-accent: #0f1216; --border: #2a313b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  main {
    width: 100%; max-width: 420px; text-align: center; padding: 32px 24px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--text-2); margin: 0 0 20px; line-height: 1.6; }
  a {
    display: inline-block; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600;
    background: var(--accent); color: var(--on-accent);
  }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>SBA 編輯器已搬家</h1>

<script>

  document.getElementById('go').href = 'https://jimmywu-commits.github.io/MS/shopee2/index.html' + location.search + '#sba';
</script>
</body>
</html>
