<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>排版預覽</title>
<style>
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 300;
  src: url("字體/ShopeeNotoSans(content)-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 400;
  src: url("字體/ShopeeNotoSans(content)-Medium.ttf") format("truetype");
}
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 700;
  src: url("字體/ShopeeNotoSans(content)-Bold.ttf") format("truetype");
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#stage { position: relative; }
#canvas {
  position: absolute; top: 0; left: 0;
  /* 尺寸由 layout-runtime.js 從 config.css 讀取後設定，不在這裡硬碼 */
  overflow: hidden; transform-origin: top left;
}
#底圖 {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1; pointer-events: none; display: none;
}
#css-err {
  display: none; position: fixed;
  top: 14px; left: 50%; transform: translateX(-50%);
  background: #7f1d1d; color: #fca5a5;
  font-size: 13px; font-family: monospace;
  padding: 7px 16px; border-radius: 6px; z-index: 9999;
}
</style>
<style id="export-stable-logo-lines">
/* Export-stable cleanup: remove every legacy or JS-generated logo line source */
.主logo橫線,
.主logo橫線_左,
.主logo橫線_右,
svg.main-logo-auto-lines {
  display: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
}

.蝦皮商城logo紅底::before,
.蝦皮商城logo紅底::after {
  content: none !important;
  display: none !important;
}

/*
  Export-stable main logo label:
  - no JS measurement
  - no SVG dynamic line
  - no transform
  - pure CSS flex layout
  - total original PS span: x 35 → 253 = 218px
  - text centered
  - left/right lines equal length
  - 6px gap on both sides
  - 2px line
*/
.官方旗艦店 {
  position: absolute !important;
  left: 35px !important;
  top: 96.4px !important;
  width: 218px !important;
  height: 30px !important;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;

  font-family: "ShopeeNotoSans (content)" !important;
  font-weight: 300 !important;
  font-size: 29.63px !important;
  line-height: 30px !important;
  white-space: nowrap !important;
  color: #fff !important;
  text-align: center !important;

  transform: none !important;
  -moz-transform: none !important;
  -webkit-transform: none !important;
  -ms-transform: none !important;

  z-index: 999 !important;
}

.官方旗艦店::before,
.官方旗艦店::after {
  content: "" !important;
  display: block !important;
  flex: 1 1 auto !important;
  min-width: 0 !important;
  height: 0 !important;
  border-top: 2px solid #fff !important;
  opacity: 1 !important;
  visibility: visible !important;
}

/* Stabilize subtitle export by removing matrix scaling and using final equivalent size/position */
.副標案型七字內 {
  transform: none !important;
  -moz-transform: none !important;
  -webkit-transform: none !important;
  -ms-transform: none !important;
  font-size: 60.08px !important;
  line-height: 1 !important;
  top: 34.08px !important;
}
</style>
</head>
<!-- data-fw/fh：CSS 讀不到時的 fallback 尺寸 -->
<body data-fw="1125" data-fh="156">
<div id="css-err"></div>
<div id="stage">
  <div id="canvas">
    <img id="底圖" src="" alt="">
    <!-- 圖層由 layout-runtime.js 從 --layers 自動產生 -->
  </div>
</div>
<script src="../js/layout-runtime.js"></script>
</body>
</html>
