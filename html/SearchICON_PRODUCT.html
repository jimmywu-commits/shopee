<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>SearchICON_PRODUCT 排版預覽</title>
<style>
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 300;
  src: url("../fonts/ShopeeNotoSans(content)-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 400;
  src: url("../fonts/ShopeeNotoSans(content)-Medium.ttf") format("truetype");
}
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 700;
  src: url("../fonts/ShopeeNotoSans(content)-Bold.ttf") format("truetype");
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#stage { position: relative; }
#canvas {
  position: absolute; top: 0; left: 0;
  overflow: hidden; transform-origin: top left;
}
#底圖 {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1; pointer-events: none; display: none;
}
#css-err {
  display: none; position: fixed;
  top: 14px; left: 50%; transform: translateX(-50%);
  background: #7f1d1d; color: #fca5a5;
  font-size: 13px; font-family: monospace;
  padding: 7px 16px; border-radius: 6px; z-index: 9999;
}
</style>
</head>
<!-- 搜尋頁 / 搜尋結果頁 ICON：只吃商品圖第一張（120x120px） -->
<body data-fw="120" data-fh="120">
<div id="css-err"></div>
<div id="stage">
  <div id="canvas">
    <img id="底圖" src="" alt="">
    <!-- 圖層由 layout-runtime.js 從 --layers 自動產生 -->
  </div>
</div>
<script src="../js/layout-runtime.js"></script>
<script>
/* ════════════════════════════════════════════════════
   SearchICON_PRODUCT 專用：
   1) 商品只連動「上傳曝光品的第一個」，其餘自動移除。
   2) 商品圖倒入圓底畫布時，預設「上下左右置中」，
      預設大小＝圓底畫布（120x120）的 80%（維持圖片原比例，不變形）。
      之後仍可用滑鼠拖拉四角放大縮小、拖曳移動位置（沿用系統既有曝品圖機制）。
   下載時額外多存一張 84x84（由 bn-editor-plugin.js 統一處理）。
   ════════════════════════════════════════════════════ */
(function(){
  function keepFirstProductOnly(){
    var zone = document.querySelector('.商品範圍');
    if(!zone) return;
    var boxes = Array.prototype.slice.call(zone.querySelectorAll('.bn-prod-box'));
    if(boxes.length <= 1) return;
    boxes.sort(function(a,b){
      return (parseInt(a.dataset.position, 10) || 0) - (parseInt(b.dataset.position, 10) || 0);
    });
    boxes.slice(1).forEach(function(b){ b.remove(); });
  }

  function applyDefaultSize(box, zone){
    var zw = zone.clientWidth || 120, zh = zone.clientHeight || 120;
    var target = Math.round(Math.min(zw, zh) * 0.8); /* 圓底畫布 80% */
    function place(ratio){
      var w = target, h = target;
      if(ratio && ratio > 0){
        if(ratio >= 1){ w = target; h = Math.round(target / ratio); }
        else { h = target; w = Math.round(target * ratio); }
      }
      box.style.width  = w + 'px';
      box.style.height = h + 'px';
      box.style.left   = Math.round((zw - w) / 2) + 'px';
      box.style.top    = Math.round((zh - h) / 2) + 'px';
    }
    var img = box.querySelector('img');
    if(img){
      if(img.complete && img.naturalWidth){
        place(img.naturalWidth / img.naturalHeight);
      }else{
        place(1);
        img.addEventListener('load', function(){
          place(img.naturalWidth / img.naturalHeight);
        }, {once:true});
      }
    }else{
      place(1);
    }
  }

  window.addEventListener('message', function(e){
    if (!e.data) return;
    if (e.data.type === 'bn-product-add') {
      setTimeout(function(){
        keepFirstProductOnly();
        var zone = document.querySelector('.商品範圍');
        var box = zone && zone.querySelector('.bn-prod-box[data-id="' + e.data.id + '"]');
        /* 只有「從來沒被使用者手動調過大小/位置」的全新商品才套用 80% 預設值；
           如果系統已經還原過使用者之前手動調整/儲存的版面（dataset.manualLayout==='1'，
           由 layoutProducts() 在商品建立時同步設定），就不要蓋掉，
           否則勾掉版位再勾回來，或重新整理後，使用者調過的大小就會被重置成 80%。 */
        if(zone && box && box.dataset.manualLayout !== '1'){
          applyDefaultSize(box, zone);
        }
      }, 20);
    }
    if (e.data.type === 'bn-product-remove' || e.data.type === 'bn-product-zorder') {
      setTimeout(keepFirstProductOnly, 0);
    }
  });
})();
</script>
</body>
</html>
